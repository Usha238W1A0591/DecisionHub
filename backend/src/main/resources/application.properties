spring.application.name=decisionhub

# MySQL Database - uses environment variables on Railway, local values as fallback
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/decisionhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Usha}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Port - Railway sets PORT automatically
server.port=${PORT:8080}

# JWT Secret
app.jwt.secret=${JWT_SECRET:DecisionHubSecretKey2026VeryLongSecretKeyForJWTSigning}
app.jwt.expiration=86400000

# CORS - allow both local and deployed frontend
spring.mvc.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
